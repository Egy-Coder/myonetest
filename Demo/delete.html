<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Delete Post</title>
    <link rel="icon" href="imgs/a.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="libs/fontawesome-free-7/css/all.css" />
    <link rel="stylesheet" href="libs/bootstrap-materia.css" />
    <link rel="stylesheet" href="styles/style.css" />
</head>

<body>


    <div class="container-fluid">
        <center>
            <h1>Delete Post</h1>

            <br> <br>

            <div class="row">
                <div class="col-xl-6">
                    <input type="text" id="Title" class="form-control" readonly>
                </div>
                <div class="col-xl-6">
                    <input type="text" id="Body" class="form-control" readonly>
                </div>
            </div>

            <br> <br>

            <input type="button" value="Delete" id="deletePost" class="btn btn-primary">

        </center>
    </div>


    <script src="/libs/jquery-3.7.1.js"></script>
    <script src="/libs/fontawesome-free-7/js/all.js"></script>
    <script src="/libs/bootstrap-5/js/bootstrap.bundle.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/JqueryTutorial.js"></script>
    <script>

        $(function () {

            var url_id = new URLSearchParams(window.location.search);
            var iid = url_id.get('id');

            $.ajax({

                type: "GET",
                url: "https://jsonplaceholder.typicode.com/posts/" + iid + "",
                success: function (res) {
                    $('#Title').val(res.title);
                    $('#Body').val(res.body);
                }

            });


            $('#deletePost').click(function () {

                var mytitle = $('#Title').val();
                var mybody = $('#Body').val();

                $.ajax({

                    type: "Delete",
                    url: "https://jsonplaceholder.typicode.com/posts/" + iid + "",
                    success: function (res) {
                        alert("post deleted");
                    }

                });
            });


        });


    </script>
</body>

</html>
